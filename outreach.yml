name: Daily outreach prep
on:
  schedule:
    - cron: "0 12 * * *"       # 12:00 UTC = 8am New York (summer) / 7am (winter)
    - cron: "0 */4 * * *"      # sync-only every 4 hours (keeps the Outreach Log up to date)
  workflow_dispatch:
    inputs:
      sync_only:
        description: "Only sync sent messages (no new writing)"
        type: boolean
        default: false
concurrency:
  group: outreach
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        run: |
          if [ "${{ github.event.schedule }}" = "0 */4 * * *" ] || [ "${{ github.event.inputs.sync_only }}" = "true" ]; then
            python main.py --sync-only
          else
            python main.py
          fi
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          AI_API_KEYS: ${{ secrets.AI_API_KEYS }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          AGENT_ACCOUNTS: ${{ vars.AGENT_ACCOUNTS }}
          OFFER: ${{ vars.OFFER }}
          SENDER_NAME: ${{ vars.SENDER_NAME }}
          AGENCY_NAME: ${{ vars.AGENCY_NAME }}
          DAILY_LIMIT_PER_ACCOUNT: ${{ vars.DAILY_LIMIT_PER_ACCOUNT }}
          FOLLOWUP_GAPS: ${{ vars.FOLLOWUP_GAPS }}
          DATE_FORMAT: ${{ vars.DATE_FORMAT }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          LEADS_TAB: ${{ vars.LEADS_TAB }}
          CASE_STUDIES: ${{ vars.CASE_STUDIES }}
          FREE_SAMPLE: ${{ vars.FREE_SAMPLE }}
          SEND_WINDOW: ${{ vars.SEND_WINDOW }}
          MSG_GAP_MINUTES: ${{ vars.MSG_GAP_MINUTES }}
